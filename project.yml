name: MedLiveActivity
options:
  bundleIdPrefix: com.antoniopineda
  deploymentTarget:
    iOS: "17.0"

targets:
  MedLiveActivity:
    type: application
    platform: iOS
    sources:
      - path: MedLiveActivity
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MedLiveActivity/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "MedLiveActivity necesita leer tus medicamentos para mostrar tus alertas personalizadas."
        NSHealthUpdateUsageDescription: "MedLiveActivity registrará tus tomas de medicamentos en la app Salud."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: MedLiveWidgets
        embed: true

  MedLiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MedLiveWidgets
      - path: MedLiveActivity/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.antoniopineda.MedLiveActivity.MedLiveWidgets
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: MedLiveWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
