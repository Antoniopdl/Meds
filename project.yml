name: MedLiveActivity
options:
  bundleIdPrefix: com.antoniopineda
  deploymentTarget:
    iOS: "17.0"

targets:
  MedLiveActivity:
    type: application
    platform: iOS
    sources:
      - path: MedLiveActivity
    info:
      path: MedLiveActivity/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: MedLiveWidgets
        embed: true

  MedLiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MedLiveWidgets
      - path: MedLiveActivity/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.antoniopineda.MedLiveActivity.MedLiveWidgets
    info:
      path: MedLiveWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
